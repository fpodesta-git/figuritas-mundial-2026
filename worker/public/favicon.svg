<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo blanco con borde negro -->
  <circle cx="32" cy="32" r="30" fill="#f0f0f0" stroke="#111" stroke-width="2"/>

  <!-- Parche central (pentágono negro) -->
  <polygon points="32,14 42,21 38,33 26,33 22,21" fill="#111"/>

  <!-- Parches laterales superiores -->
  <polygon points="22,21 10,20 8,32 18,37 26,33" fill="#111"/>
  <polygon points="42,21 54,20 56,32 46,37 38,33" fill="#111"/>

  <!-- Parches laterales inferiores -->
  <polygon points="18,37 12,48 22,54 30,46 26,33" fill="#111"/>
  <polygon points="46,37 52,48 42,54 34,46 38,33" fill="#111"/>

  <!-- Parche inferior central -->
  <polygon points="30,46 34,46 42,54 32,58 22,54" fill="#111"/>

  <!-- Borde exterior -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#111" stroke-width="2"/>
</svg>
